# JiuwenSwarm is the agent brain; DSH is Cordis ABI/shell only (ARCHITECTURE.md).
# Default mode=gateway (override with JIUWEN_MODE=openai for diagnostics).
#
# Make any agent-loop / host select Jiuwen (e.g. DSH agent, FlyBot):
#   - id: agent-default-model
#     config: { provider: jiuwen, model: jiuwen-default }
#
- insert:
    - id: llm-jiuwen
      name: '@dsh-jiuwen/adapter'
      config:
        provider: jiuwen
        displayName: JiuwenSwarm
        mode: gateway
        defaultModel: jiuwen-default
        models:
          - id: jiuwen-default
            name: Jiuwen Default
            contextWindow: 128000
            maxTokens: 8192
          - id: jiuwen-swarm
            name: Jiuwen Swarm
            contextWindow: 128000
            maxTokens: 8192
